<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Calculator</title>

<style>

*{box-sizing:border-box;font-family:Segoe UI;}

body{
margin:0;
background: linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:10px;
color:white;
}

.container{
width:100%;
max-width:380px;
background: rgba(255,255,255,0.15);
padding:20px;
border-radius:18px;
backdrop-filter: blur(12px);
box-shadow:0 8px 25px rgba(0,0,0,0.3);
text-align:center;
}

h2{margin-bottom:15px;font-size:20px;}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
font-size:15px;
}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:10px;
background:#ffffff30;
color:white;
font-size:15px;
cursor:pointer;
}

button:active{transform:scale(0.96);}

.result{
margin-top:10px;
background:#ffffff20;
padding:12px;
border-radius:10px;
font-size:14px;
text-align:left;
line-height:1.6;
}

.hidden{display:none;}

.back{
margin-top:10px;
background:#00000040;
}

.footer{
margin-top:12px;
font-size:12px;
}

.footer a{
color:#00ffcc;
text-decoration:none;
}

</style>
</head>

<body>

<div class="container">

<!-- HOME -->
<div id="home">
<h2>Select Option</h2>
<button onclick="show('one')">1% Calculator</button>
<button onclick="show('diff')">Price Difference %</button>
<button onclick="show('profit')">Amount to %</button>
</div>

<!-- 1% -->
<div id="one" class="hidden">
<h2>1% Calculator</h2>
<input type="number" id="price1" placeholder="Enter Price" oninput="calcOne()">
<div class="result" id="res1"></div>
<button class="back" onclick="back()">Back</button>
</div>

<!-- Difference -->
<div id="diff" class="hidden">
<h2>Price Difference %</h2>
<input type="number" id="cost" placeholder="Cost Price">
<input type="number" id="sell" placeholder="Selling Price" oninput="calcDiff()">
<div class="result" id="res2"></div>
<button class="back" onclick="back()">Back</button>
</div>

<!-- Profit -->
<div id="profit" class="hidden">
<h2>Amount to %</h2>
<input type="number" id="base" placeholder="Base Price">
<input type="number" id="profitVal" placeholder="Profit Amount" oninput="calcProfit()">
<div class="result" id="res3"></div>
<button class="back" onclick="back()">Back</button>
</div>

<div class="footer">
Created by 
<a href="https://wa.me/923XXXXXXXXX" target="_blank">M Farooq</a>
</div>

</div>

<script>

function show(id){
document.getElementById("home").style.display="none";
document.getElementById(id).style.display="block";
}

function back(){
document.querySelectorAll(".hidden").forEach(e=>e.style.display="none");
document.getElementById("home").style.display="block";
}

/* 1% Calculator */
function calcOne(){
let p = parseFloat(document.getElementById("price1").value);
if(!p) return;

let one = p/100;
let total = p + one;

document.getElementById("res1").innerHTML =
"Original Price: " + p + "<br>" +
"Percentage: 1%<br>" +
"Percentage Amount: " + one.toFixed(2) + "<br>" +
"Formula: (" + p + " ÷ 100)<br><hr>" +
"Total Price: " + total.toFixed(2);
}

/* Difference % */
function calcDiff(){
let cost = parseFloat(document.getElementById("cost").value);
let sell = parseFloat(document.getElementById("sell").value);
if(!cost || !sell) return;

let diff = sell - cost;
let percent = (diff / cost) * 100;

document.getElementById("res2").innerHTML =
"Cost Price: " + cost + "<br>" +
"Selling Price: " + sell + "<br>" +
"Difference Amount: " + diff.toFixed(2) + "<br>" +
"Formula: (" + diff.toFixed(2) + " ÷ " + cost + ") × 100<br>" +
"Percentage: " + percent.toFixed(2) + "%";
}

/* Profit % */
function calcProfit(){
let base = parseFloat(document.getElementById("base").value);
let profit = parseFloat(document.getElementById("profitVal").value);
if(!base || !profit) return;

let percent = (profit / base) * 100;
let total = base + profit;

document.getElementById("res3").innerHTML =
"Base Price: " + base + "<br>" +
"Profit Amount: " + profit + "<br>" +
"Formula: (" + profit + " ÷ " + base + ") × 100<br>" +
"Percentage: " + percent.toFixed(2) + "%<br><hr>" +
"Total Price: " + total.toFixed(2);
}

</script>

</body>
</html>
