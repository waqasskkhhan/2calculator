<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Price Calculator</title>

<style>

*{
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#667eea,#764ba2);
}

/* Card */
.container{
width:360px;
padding:25px;
border-radius:20px;
background: rgba(255,255,255,0.15);
backdrop-filter: blur(12px);
box-shadow:0 8px 30px rgba(0,0,0,0.3);
color:white;
text-align:center;
}

/* Title */
h2{
margin-bottom:20px;
}

/* Input */
input{
width:100%;
padding:14px;
font-size:18px;
border-radius:12px;
border:none;
outline:none;
margin-bottom:20px;
}

/* Buttons Grid */
.buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:20px;
}

/* Buttons */
button{
padding:12px;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
background: rgba(255,255,255,0.2);
color:white;
transition:0.3s;
}

/* Hover + Active */
button:hover{
background:white;
color:#333;
transform:scale(1.05);
}

button.active{
background:#00ffcc;
color:#000;
font-weight:bold;
}

/* Result Box */
.result{
background: rgba(255,255,255,0.2);
padding:15px;
border-radius:12px;
text-align:left;
font-size:15px;
line-height:1.7;
}

/* Footer */
.footer{
margin-top:20px;
font-size:13px;
}

.footer a{
color:#00ffcc;
text-decoration:none;
font-weight:bold;
}

.footer a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="container">

<h2>Smart Calculator</h2>

<input type="number" id="price" placeholder="Enter Price">

<div class="buttons">

<button onclick="calculate(this,1)">1%</button>
<button onclick="calculate(this,2)">2%</button>
<button onclick="calculate(this,3)">3%</button>
<button onclick="calculate(this,5)">5%</button>
<button onclick="calculate(this,10)">10%</button>

</div>

<div class="result" id="result">Enter price and select percentage</div>

<div class="footer">
Created by 
<a href="https://wa.me/923041756083" target="_blank">M Farooq</a>
</div>

</div>

<script>

function calculate(btn, percent){

let price = parseFloat(document.getElementById("price").value);

if(!price){
document.getElementById("result").innerHTML="⚠️ Please enter price first";
return;
}

/* Active Button Highlight */
document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

/* Calculation */
let percentAmount = (price * percent) / 100;
let total = price + percentAmount;

/* Output */
document.getElementById("result").innerHTML = `
<b>💰 Original Price:</b> ${price}<br>
<b>📊 Percentage:</b> ${percent}%<br>
<b>➕ Added Amount:</b> ${percentAmount.toFixed(2)}<br>
<b>🧮 Formula:</b> (${price} × ${percent}) ÷ 100<br>
<hr>
<b>✅ Final Price:</b> ${total.toFixed(2)}
`;

}

</script>

</body>
</html>
